<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Colorlens</title><desc id="d">Color values transform across a smooth spectrum.</desc><defs><linearGradient id="bg"><stop stop-color="#18243a"/><stop offset="1" stop-color="#09111d"/></linearGradient><linearGradient id="s"><stop stop-color="#ff7777"/><stop offset=".2" stop-color="#ffc777"/><stop offset=".4" stop-color="#e5e879"/><stop offset=".6" stop-color="#62e3c1"/><stop offset=".8" stop-color="#78a8ff"/><stop offset="1" stop-color="#bd8cff"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="110" y="105" width="980" height="90" rx="18" fill="url(#s)"><animate attributeName="opacity" values=".8;1;.8" dur="3s" repeatCount="indefinite"/></rect><g fill="#edf3ff" font-family="monospace" font-size="16"><text x="115" y="235">HEX</text><text x="405" y="235">RGB</text><text x="690" y="235">HSL</text><text x="985" y="235">CONTRAST</text></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">COLORLENS</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">CONVERT / COMPARE / CHECK</text></svg>